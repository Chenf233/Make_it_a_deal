<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>底盘控制 | SmartStation</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #090c0f;
            --panel: #12181d;
            --panel-2: #182027;
            --line: #2c3841;
            --text: #f1f5f7;
            --muted: #91a0aa;
            --accent: #d8ff3e;
            --accent-dark: #28340d;
            --danger: #ff675e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 15% 0%, #28351d 0, transparent 34%),
                var(--bg);
            background-size: 32px 32px, 32px 32px, auto, auto;
            color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        main {
            width: min(940px, 100%);
        }

        header {
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 8px 0 10px;
            font-size: clamp(36px, 7vw, 68px);
            line-height: 0.95;
        }

        .intro {
            max-width: 720px;
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
            gap: 18px;
        }

        .panel {
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(24, 32, 39, 0.96), rgba(14, 19, 23, 0.96));
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
        }

        .panel-title {
            margin: 0 0 18px;
            font-size: 17px;
        }

        .direction-pad {
            display: grid;
            grid-template-columns: repeat(3, minmax(90px, 1fr));
            grid-template-areas:
                ". forward ."
                "left stop right"
                ". backward .";
            gap: 12px;
        }

        .motion-button,
        .stop-button,
        .destination-button {
            min-height: 112px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel-2);
            color: var(--text);
            font: inherit;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 100ms ease, border-color 100ms ease, background 100ms ease;
        }

        .motion-button:hover,
        .destination-button:hover {
            border-color: #53636e;
        }

        .motion-button:focus-visible,
        .destination-button:focus-visible,
        .stop-button:focus-visible {
            outline: 3px solid rgba(216, 255, 62, 0.32);
            outline-offset: 3px;
        }

        .motion-button.running {
            transform: scale(0.97);
            border-color: var(--accent);
            background: var(--accent-dark);
            color: var(--accent);
        }

        .motion-button[disabled],
        .destination-button[disabled] {
            cursor: not-allowed;
            opacity: 0.42;
        }

        [data-motion="forward"] {
            grid-area: forward;
        }

        [data-motion="backward"] {
            grid-area: backward;
        }

        [data-motion="turn-left"] {
            grid-area: left;
        }

        [data-motion="turn-right"] {
            grid-area: right;
        }

        .stop-button {
            grid-area: stop;
            border-color: rgba(255, 103, 94, 0.65);
            background: rgba(255, 103, 94, 0.08);
            color: #ff918b;
        }

        .stop-button:hover {
            background: rgba(255, 103, 94, 0.15);
        }

        .destination-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .destination-button {
            min-height: 138px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            padding: 20px;
        }

        .destination-button strong {
            font-size: 34px;
        }

        .destination-button span {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .status-card {
            margin-top: 14px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.16);
        }

        #status {
            min-height: 24px;
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        #status.error {
            color: #ff918b;
        }

        .home-button {
            width: 100%;
            margin-top: 14px;
            padding: 13px 16px;
            border: 1px solid var(--accent);
            border-radius: 12px;
            background: var(--accent-dark);
            color: var(--accent);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .arrival-bubble {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 20;
            max-width: min(380px, calc(100vw - 32px));
            padding: 16px 20px;
            border: 1px solid var(--accent);
            border-radius: 14px;
            background: #1b2414;
            color: var(--accent);
            font-weight: 800;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(-14px);
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .arrival-bubble.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 760px) {
            body {
                padding: 16px;
                place-items: start center;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 16px;
            }

            .motion-button,
            .stop-button {
                min-height: 92px;
                font-size: 15px;
            }

            .direction-pad {
                grid-template-columns: repeat(3, minmax(76px, 1fr));
                gap: 9px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <span class="eyebrow">Differential Drive Control</span>
            <h1>底盘控制</h1>
            <p class="intro">方向按钮按住运行、松开停止。自动任务从物流中心出发，3 秒到达驿站，停留 3 秒后用 3 秒返回物流中心。</p>
        </header>

        <div class="dashboard">
            <section class="panel">
                <h2 class="panel-title">手动控制</h2>
                <div class="direction-pad">
                    <button class="motion-button" type="button" data-motion="forward">前进</button>
                    <button class="motion-button" type="button" data-motion="backward">后退</button>
                    <button class="motion-button" type="button" data-motion="turn-left">原地左旋</button>
                    <button class="motion-button" type="button" data-motion="turn-right">原地右旋</button>
                    <button id="stopAllButton" class="stop-button" type="button">全部停止</button>
                </div>
            </section>

            <section class="panel">
                <h2 class="panel-title">自动到点</h2>
                <div class="destination-grid">
                    <button class="destination-button" type="button" data-destination="a">
                        <strong>到驿站1</strong>
                        <span>3 秒到站 · 停留后返回</span>
                    </button>
                    <button class="destination-button" type="button" data-destination="b">
                        <strong>到驿站2</strong>
                        <span>3 秒到站 · 停留后返回</span>
                    </button>
                </div>

                <div class="status-card">
                    <p id="status" role="status">底盘位于物流中心，等待任务。</p>
                    <button id="confirmCenterButton" class="home-button hidden" type="button">已人工归位物流中心</button>
                </div>
            </section>
        </div>
    </main>
    <div id="arrivalBubble" class="arrival-bubble" role="status" aria-live="polite"></div>

    <script>
        const motionButtons = [...document.querySelectorAll("[data-motion]")];
        const destinationButtons = [...document.querySelectorAll("[data-destination]")];
        const stopAllButton = document.getElementById("stopAllButton");
        const statusElement = document.getElementById("status");
        const confirmCenterButton = document.getElementById("confirmCenterButton");
        const arrivalBubble = document.getElementById("arrivalBubble");

        let activeMotion = null;
        let commandQueue = Promise.resolve();
        let latestState = null;
        let lastShownArrivalId = null;
        let bubbleTimer = null;

        function setStatus(message, isError = false) {
            statusElement.textContent = message;
            statusElement.classList.toggle("error", isError);
        }

        function queueCommand(command) {
            commandQueue = commandQueue.catch(() => {}).then(command);
            return commandQueue;
        }

        async function sendCommand(url, options = {}) {
            const response = await fetch(url, { method: "POST", ...options });
            const result = await response.json();
            if (!response.ok || (result.code !== undefined && result.code !== 200)) {
                const error = new Error(result.message || "控制请求失败");
                error.state = result.data;
                throw error;
            }
            return result;
        }

        function renderState(state) {
            if (!state) return;
            latestState = state;

            const busy = Boolean(state.busy);
            motionButtons.forEach(button => {
                const isActive = state.mode === "manual" && state.motion === button.dataset.motion;
                button.classList.toggle("running", isActive);
                button.disabled = busy && !isActive;
            });
            destinationButtons.forEach(button => {
                button.disabled = busy || Boolean(state.requires_homing);
            });
            confirmCenterButton.classList.toggle("hidden", !state.requires_homing || busy);

            if (state.mode === "automatic") {
                const station = stationLabel(state.destination);
                if (state.phase === "outbound") {
                    setStatus(`正在从物流中心前往${station}，剩余 ${Number(state.phase_remaining_seconds).toFixed(2)} 秒。`);
                } else if (state.phase === "dwell") {
                    setStatus(`已到达${station}，停留中，${Number(state.phase_remaining_seconds).toFixed(2)} 秒后返回。`);
                    if (state.arrival_id !== null && state.arrival_id !== lastShownArrivalId) {
                        lastShownArrivalId = state.arrival_id;
                        showArrivalBubble(`已到达${station}，停留 3 秒后返回物流中心`);
                    }
                } else {
                    setStatus(`正在从${station}返回物流中心，剩余 ${Number(state.phase_remaining_seconds).toFixed(2)} 秒。`);
                }
            } else if (state.mode === "manual") {
                setStatus(`正在执行手动动作：${motionLabel(state.motion)}。松开后位置将标记为未知。`);
            } else if (state.requires_homing) {
                setStatus("底盘位置未知。请人工归位物流中心后点击确认。", true);
            } else {
                setStatus("底盘位于物流中心，等待任务。");
            }
        }

        function stationLabel(destination) {
            return destination === "station_1" ? "驿站1" : "驿站2";
        }

        function showArrivalBubble(message) {
            arrivalBubble.textContent = message;
            arrivalBubble.classList.add("visible");
            clearTimeout(bubbleTimer);
            bubbleTimer = setTimeout(() => arrivalBubble.classList.remove("visible"), 3200);
        }

        function motionLabel(motion) {
            return {
                "forward": "前进",
                "backward": "后退",
                "turn-left": "原地左旋",
                "turn-right": "原地右旋"
            }[motion] || motion;
        }

        function startManual(button) {
            if (activeMotion || latestState?.busy) return;

            const motion = button.dataset.motion;
            activeMotion = motion;
            button.classList.add("running");
            motionButtons.forEach(other => {
                if (other !== button) other.disabled = true;
            });
            destinationButtons.forEach(destination => destination.disabled = true);
            setStatus(`正在启动：${motionLabel(motion)}...`);

            queueCommand(async () => {
                try {
                    const result = await sendCommand(`/api/wheels/motions/${motion}/start`);
                    renderState(result.data);
                } catch (error) {
                    activeMotion = null;
                    if (error.state) renderState(error.state);
                    setStatus(error.message, true);
                    await refreshState();
                }
            });
        }

        function stopManual(button) {
            const motion = button.dataset.motion;
            if (activeMotion !== motion) return;

            activeMotion = null;
            setStatus(`正在停止：${motionLabel(motion)}...`);
            queueCommand(async () => {
                try {
                    const result = await sendCommand(`/api/wheels/motions/${motion}/stop`);
                    renderState(result.data);
                } catch (error) {
                    setStatus(error.message, true);
                    await refreshState();
                }
            });
        }

        function goToDestination(button) {
            if (activeMotion || latestState?.busy) return;

            const destination = button.dataset.destination;
            setStatus(`正在启动${destination === "a" ? "驿站1" : "驿站2"}往返任务...`);
            queueCommand(async () => {
                try {
                    const result = await sendCommand(`/api/wheels/destinations/${destination}`);
                    renderState(result.data);
                    setStatus(result.message);
                } catch (error) {
                    if (error.state) renderState(error.state);
                    setStatus(error.message, true);
                    await refreshState();
                }
            });
        }

        function stopAll() {
            activeMotion = null;
            motionButtons.forEach(button => button.classList.remove("running"));
            queueCommand(async () => {
                try {
                    const result = await sendCommand("/api/wheels/stop-all");
                    renderState(result.data);
                } catch (error) {
                    setStatus(error.message, true);
                }
            });
        }

        async function refreshState() {
            try {
                const response = await fetch("/api/wheels/status");
                const result = await response.json();
                if (result.code === 200) renderState(result.data);
            } catch (error) {
                setStatus("无法读取底盘状态，请检查服务连接。", true);
            }
        }

        motionButtons.forEach(button => {
            button.addEventListener("contextmenu", event => event.preventDefault());
            button.addEventListener("pointerdown", event => {
                if (event.pointerType === "mouse" && event.button !== 0) return;
                event.preventDefault();
                button.setPointerCapture(event.pointerId);
                startManual(button);
            });
            button.addEventListener("pointerup", event => {
                event.preventDefault();
                stopManual(button);
            });
            button.addEventListener("pointercancel", () => stopManual(button));
            button.addEventListener("lostpointercapture", () => stopManual(button));
            button.addEventListener("keydown", event => {
                if ((event.key === " " || event.key === "Enter") && !event.repeat) {
                    event.preventDefault();
                    startManual(button);
                }
            });
            button.addEventListener("keyup", event => {
                if (event.key === " " || event.key === "Enter") {
                    event.preventDefault();
                    stopManual(button);
                }
            });
        });

        destinationButtons.forEach(button => {
            button.addEventListener("click", () => goToDestination(button));
        });

        stopAllButton.addEventListener("click", stopAll);
        confirmCenterButton.addEventListener("click", () => queueCommand(async () => {
            try {
                const result = await sendCommand("/api/wheels/confirm-logistics-center");
                renderState(result.data);
                setStatus(result.message);
            } catch (error) {
                if (error.state) renderState(error.state);
                setStatus(error.message, true);
            }
        }));
        window.addEventListener("blur", () => {
            if (!activeMotion) return;
            const button = motionButtons.find(item => item.dataset.motion === activeMotion);
            if (button) stopManual(button);
        });
        window.addEventListener("pagehide", () => {
            if (!activeMotion) return;
            navigator.sendBeacon(`/api/wheels/motions/${activeMotion}/stop`);
            activeMotion = null;
        });

        refreshState();
        setInterval(refreshState, 500);
    </script>
</body>
</html>
