<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>底盘控制 | SmartStation</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #090c0f;
            --panel: #12181d;
            --panel-2: #182027;
            --line: #2c3841;
            --text: #f1f5f7;
            --muted: #91a0aa;
            --accent: #d8ff3e;
            --accent-dark: #28340d;
            --danger: #ff675e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 15% 0%, #28351d 0, transparent 34%),
                var(--bg);
            background-size: 32px 32px, 32px 32px, auto, auto;
            color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        main {
            width: min(940px, 100%);
        }

        header {
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 8px 0 10px;
            font-size: clamp(36px, 7vw, 68px);
            line-height: 0.95;
        }

        .intro {
            max-width: 720px;
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
            gap: 18px;
        }

        .panel {
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(24, 32, 39, 0.96), rgba(14, 19, 23, 0.96));
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
        }

        .panel-title {
            margin: 0 0 18px;
            font-size: 17px;
        }

        .direction-pad {
            display: grid;
            grid-template-columns: repeat(3, minmax(90px, 1fr));
            grid-template-areas:
                ". forward ."
                "left stop right"
                ". backward .";
            gap: 12px;
        }

        .motion-button,
        .stop-button,
        .destination-button {
            min-height: 112px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel-2);
            color: var(--text);
            font: inherit;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 100ms ease, border-color 100ms ease, background 100ms ease;
        }

        .motion-button:hover,
        .destination-button:hover {
            border-color: #53636e;
        }

        .motion-button:focus-visible,
        .destination-button:focus-visible,
        .stop-button:focus-visible {
            outline: 3px solid rgba(216, 255, 62, 0.32);
            outline-offset: 3px;
        }

        .motion-button.running {
            transform: scale(0.97);
            border-color: var(--accent);
            background: var(--accent-dark);
            color: var(--accent);
        }

        .motion-button[disabled],
        .destination-button[disabled] {
            cursor: not-allowed;
            opacity: 0.42;
        }

        [data-motion="forward"] {
            grid-area: forward;
        }

        [data-motion="backward"] {
            grid-area: backward;
        }

        [data-motion="turn-left"] {
            grid-area: left;
        }

        [data-motion="turn-right"] {
            grid-area: right;
        }

        .stop-button {
            grid-area: stop;
            border-color: rgba(255, 103, 94, 0.65);
            background: rgba(255, 103, 94, 0.08);
            color: #ff918b;
        }

        .stop-button:hover {
            background: rgba(255, 103, 94, 0.15);
        }

        .destination-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .destination-button {
            min-height: 138px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            padding: 20px;
        }

        .destination-button strong {
            font-size: 34px;
        }

        .destination-button span {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .position-card {
            margin-top: 14px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.16);
        }

        .position-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .position-head span {
            color: var(--muted);
            font-size: 13px;
        }

        #positionValue {
            font-family: Consolas, monospace;
            font-size: 28px;
        }

        .track {
            position: relative;
            height: 8px;
            margin: 20px 5px 8px;
            border-radius: 999px;
            background: #303a41;
        }

        .track::before,
        .track::after {
            position: absolute;
            top: 17px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .track::before {
            left: -5px;
            content: "B";
        }

        .track::after {
            right: -5px;
            content: "A";
        }

        #positionMarker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            border: 3px solid #11171b;
            border-radius: 50%;
            background: var(--accent);
            transform: translate(-50%, -50%);
            transition: left 180ms linear;
        }

        #status {
            min-height: 24px;
            margin: 36px 0 0;
            color: var(--muted);
            line-height: 1.6;
        }

        #status.error {
            color: #ff918b;
        }

        @media (max-width: 760px) {
            body {
                padding: 16px;
                place-items: start center;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 16px;
            }

            .motion-button,
            .stop-button {
                min-height: 92px;
                font-size: 15px;
            }

            .direction-pad {
                grid-template-columns: repeat(3, minmax(76px, 1fr));
                gap: 9px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <span class="eyebrow">Differential Drive Control</span>
            <h1>底盘控制</h1>
            <p class="intro">方向按钮按住运行、松开停止。手动操作后位置按中点重新计算；自动到点以 B=0、A=1 建模，从中点到任一端预计 3 秒。</p>
        </header>

        <div class="dashboard">
            <section class="panel">
                <h2 class="panel-title">手动控制</h2>
                <div class="direction-pad">
                    <button class="motion-button" type="button" data-motion="forward">前进</button>
                    <button class="motion-button" type="button" data-motion="backward">后退</button>
                    <button class="motion-button" type="button" data-motion="turn-left">原地左旋</button>
                    <button class="motion-button" type="button" data-motion="turn-right">原地右旋</button>
                    <button id="stopAllButton" class="stop-button" type="button">全部停止</button>
                </div>
            </section>

            <section class="panel">
                <h2 class="panel-title">自动到点</h2>
                <div class="destination-grid">
                    <button class="destination-button" type="button" data-destination="a">
                        <strong>到 A 地</strong>
                        <span>前进方向 · 坐标 1.0</span>
                    </button>
                    <button class="destination-button" type="button" data-destination="b">
                        <strong>到 B 地</strong>
                        <span>后退方向 · 坐标 0.0</span>
                    </button>
                </div>

                <div class="position-card">
                    <div class="position-head">
                        <span>估算位置</span>
                        <strong id="positionValue">0.5000</strong>
                    </div>
                    <div class="track" aria-label="B 地到 A 地的位置">
                        <span id="positionMarker"></span>
                    </div>
                    <p id="status" role="status">底盘空闲，当前位置为中点。</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        const motionButtons = [...document.querySelectorAll("[data-motion]")];
        const destinationButtons = [...document.querySelectorAll("[data-destination]")];
        const stopAllButton = document.getElementById("stopAllButton");
        const positionValue = document.getElementById("positionValue");
        const positionMarker = document.getElementById("positionMarker");
        const statusElement = document.getElementById("status");

        let activeMotion = null;
        let commandQueue = Promise.resolve();
        let latestState = null;

        function setStatus(message, isError = false) {
            statusElement.textContent = message;
            statusElement.classList.toggle("error", isError);
        }

        function queueCommand(command) {
            commandQueue = commandQueue.catch(() => {}).then(command);
            return commandQueue;
        }

        async function sendCommand(url, options = {}) {
            const response = await fetch(url, { method: "POST", ...options });
            const result = await response.json();
            if (!response.ok || (result.code !== undefined && result.code !== 200)) {
                const error = new Error(result.message || "控制请求失败");
                error.state = result.data;
                throw error;
            }
            return result;
        }

        function renderState(state) {
            if (!state) return;
            latestState = state;

            const position = Math.max(0, Math.min(1, Number(state.position) || 0));
            positionValue.textContent = position.toFixed(4);
            positionMarker.style.left = `${position * 100}%`;

            const busy = Boolean(state.busy);
            motionButtons.forEach(button => {
                const isActive = state.mode === "manual" && state.motion === button.dataset.motion;
                button.classList.toggle("running", isActive);
                button.disabled = busy && !isActive;
            });
            destinationButtons.forEach(button => {
                button.disabled = busy;
            });

            if (state.mode === "automatic") {
                const target = (state.destination || "").toUpperCase();
                setStatus(`正在前往 ${target} 地，预计剩余 ${Number(state.remaining_seconds).toFixed(2)} 秒。`);
            } else if (state.mode === "manual") {
                setStatus(`正在执行手动动作：${motionLabel(state.motion)}。松开按钮后停止，位置已重置为中点。`);
            } else {
                setStatus(`底盘空闲，当前估算坐标 ${position.toFixed(4)}。`);
            }
        }

        function motionLabel(motion) {
            return {
                "forward": "前进",
                "backward": "后退",
                "turn-left": "原地左旋",
                "turn-right": "原地右旋"
            }[motion] || motion;
        }

        function startManual(button) {
            if (activeMotion || latestState?.busy) return;

            const motion = button.dataset.motion;
            activeMotion = motion;
            button.classList.add("running");
            motionButtons.forEach(other => {
                if (other !== button) other.disabled = true;
            });
            destinationButtons.forEach(destination => destination.disabled = true);
            setStatus(`正在启动：${motionLabel(motion)}...`);

            queueCommand(async () => {
                try {
                    const result = await sendCommand(`/api/wheels/motions/${motion}/start`);
                    renderState(result.data);
                } catch (error) {
                    activeMotion = null;
                    if (error.state) renderState(error.state);
                    setStatus(error.message, true);
                    await refreshState();
                }
            });
        }

        function stopManual(button) {
            const motion = button.dataset.motion;
            if (activeMotion !== motion) return;

            activeMotion = null;
            setStatus(`正在停止：${motionLabel(motion)}...`);
            queueCommand(async () => {
                try {
                    const result = await sendCommand(`/api/wheels/motions/${motion}/stop`);
                    renderState(result.data);
                } catch (error) {
                    setStatus(error.message, true);
                    await refreshState();
                }
            });
        }

        function goToDestination(button) {
            if (activeMotion || latestState?.busy) return;

            const destination = button.dataset.destination;
            setStatus(`正在启动前往 ${destination.toUpperCase()} 地...`);
            queueCommand(async () => {
                try {
                    const result = await sendCommand(`/api/wheels/destinations/${destination}`);
                    renderState(result.data);
                    setStatus(result.message);
                } catch (error) {
                    if (error.state) renderState(error.state);
                    setStatus(error.message, true);
                    await refreshState();
                }
            });
        }

        function stopAll() {
            activeMotion = null;
            motionButtons.forEach(button => button.classList.remove("running"));
            queueCommand(async () => {
                try {
                    const result = await sendCommand("/api/wheels/stop-all");
                    renderState(result.data);
                } catch (error) {
                    setStatus(error.message, true);
                }
            });
        }

        async function refreshState() {
            try {
                const response = await fetch("/api/wheels/status");
                const result = await response.json();
                if (result.code === 200) renderState(result.data);
            } catch (error) {
                setStatus("无法读取底盘状态，请检查服务连接。", true);
            }
        }

        motionButtons.forEach(button => {
            button.addEventListener("contextmenu", event => event.preventDefault());
            button.addEventListener("pointerdown", event => {
                if (event.pointerType === "mouse" && event.button !== 0) return;
                event.preventDefault();
                button.setPointerCapture(event.pointerId);
                startManual(button);
            });
            button.addEventListener("pointerup", event => {
                event.preventDefault();
                stopManual(button);
            });
            button.addEventListener("pointercancel", () => stopManual(button));
            button.addEventListener("lostpointercapture", () => stopManual(button));
            button.addEventListener("keydown", event => {
                if ((event.key === " " || event.key === "Enter") && !event.repeat) {
                    event.preventDefault();
                    startManual(button);
                }
            });
            button.addEventListener("keyup", event => {
                if (event.key === " " || event.key === "Enter") {
                    event.preventDefault();
                    stopManual(button);
                }
            });
        });

        destinationButtons.forEach(button => {
            button.addEventListener("click", () => goToDestination(button));
        });

        stopAllButton.addEventListener("click", stopAll);
        window.addEventListener("blur", stopAll);
        window.addEventListener("pagehide", () => {
            activeMotion = null;
            navigator.sendBeacon("/api/wheels/stop-all");
        });

        refreshState();
        setInterval(refreshState, 500);
    </script>
</body>
</html>
